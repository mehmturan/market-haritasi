<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- MOBİL İÇİN KRİTİK VİEWPORT AYARI -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Türkiye Zincir Market Bulucu</title>
    <!-- Leaflet Harita CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f6f8; overflow: hidden; flex-direction: row; }

        /* MASAÜSTÜ (VARSAYILAN) ARAYÜZ */
        #sidebar { width: 420px; height: 100%; background: white; padding: 20px; box-shadow: 2px 0 15px rgba(0,0,0,0.15); overflow-y: auto; display: flex; flex-direction: column; z-index: 1000; transition: 0.3s; }
        #map { flex-grow: 1; height: 100%; cursor: crosshair; }

        .mobile-handle { display: none; width: 40px; height: 5px; background: #bdc3c7; border-radius: 5px; margin: 0 auto 15px auto; }
        h2 { color: #2c3e50; margin-top: 0; font-size: 22px; display: flex; align-items: center; gap: 8px; }
        .btn { background: #27ae60; color: white; border: none; padding: 14px 15px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: bold; margin-bottom: 15px; transition: 0.2s; width: 100%; box-shadow: 0 4px 6px rgba(39, 174, 96, 0.2); }
        .btn:hover { background: #219653; transform: translateY(-1px); box-shadow: 0 6px 12px rgba(39, 174, 96, 0.3); }

        .info-box { background: #eef7fc; border-left: 4px solid #3498db; padding: 12px; font-size: 13px; color: #34495e; border-radius: 6px; margin-bottom: 15px; line-height: 1.5; }

        .market-card { background: #fafbfc; padding: 15px; border-radius: 10px; border-left: 5px solid #7f8c8d; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.04); cursor: pointer; transition: all 0.2s ease; position: relative; overflow: hidden; }
        .market-card:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .market-card.active { background: #f0f9ff; transform: scale(1.01); box-shadow: 0 6px 15px rgba(52, 152, 219, 0.15); border-right: 3px solid #3498db; }

        .market-card b { color: #2c3e50; font-size: 16px; display: block; margin-bottom: 4px; }
        .distance { background: #fff3e0; color: #d35400; font-weight: bold; font-size: 13px; padding: 4px 8px; border-radius: 20px; float: right; position: relative; top: -2px; }
        .market-fullname { font-size: 12px; color: #7f8c8d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; display: block; margin-bottom: 10px; }

        /* Yol Tarifi Butonu */
        .gmaps-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e8f0fe;
            color: #1a73e8;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 6px;
            transition: 0.2s;
            margin-top: 5px;
        }
        .gmaps-btn:hover {
            background: #d2e3fc;
        }

        .loading { text-align: center; color: #7f8c8d; margin-top: 30px; font-weight: bold; }

        .leaflet-div-icon { background: transparent !important; border: none !important; overflow: visible !important; }

        .market-badge {
            position: absolute; bottom: 0px; left: 0; transform: translate(-50%, -10px);
            color: white; padding: 5px 12px; border-radius: 20px; font-weight: 900; font-size: 13px;
            border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); white-space: nowrap; width: max-content; z-index: 1000; transition: 0.2s;
        }
        .badge-arrow {
            position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            border-width: 6px 6px 0; border-style: solid;
            border-bottom-color: transparent !important; border-left-color: transparent !important; border-right-color: transparent !important;
        }

        .route-tooltip { background: rgba(30, 39, 46, 0.9) !important; border: 1px solid rgba(255,255,255,0.2) !important; color: #fff !important; font-weight: bold !important; border-radius: 8px !important; text-align: center !important; padding: 6px 12px !important; box-shadow: 0 4px 10px rgba(0,0,0,0.4) !important; font-size: 13px !important; }
        .route-tooltip::before { display: none; }

        /* TELEFONLAR İÇİN MOBİL ARAYÜZ (Max-width 768px) */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #map { width: 100%; height: 50vh; flex-grow: 0; order: 1; }
            #sidebar { width: 100%; height: 50vh; order: 2; padding: 15px 15px 30px 15px; border-radius: 20px 20px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.15); margin-top: -15px; }
            .mobile-handle { display: block; }
            h2 { font-size: 18px; margin-bottom: 12px; }
            .btn { padding: 12px; font-size: 14px; }
            .info-box { font-size: 12px; padding: 10px; }
            .market-card { padding: 12px; }
            .market-card b { font-size: 14px; }
            .distance { font-size: 11px; }
        }
    </style>
</head>

        function getBrandInfo(name) {
            let upperName = name.toUpperCase();
            let bgColor = "#7f8c8d"; 
            let shortName = name.length > 12 ? name.substring(0, 12) + "..." : name;

            if (upperName.includes("BİM") || upperName.includes("BIM")) { bgColor = "#e31837"; shortName = "BİM"; }
            else if (upperName.includes("A101") || upperName.includes("A-101")) { bgColor = "#00bcd4"; shortName = "A101"; }
            else if (upperName.includes("ŞOK") || upperName.includes("SOK")) { bgColor = "#f39c12"; shortName = "ŞOK"; }
            else if (upperName.includes("MİGROS") || upperName.includes("MIGROS")) { bgColor = "#ff7f00"; shortName = "MİGROS"; }
            else if (upperName.includes("CARREFOUR") || upperName.includes("CARREFOURSA")) { bgColor = "#2980b9"; shortName = "CARREFOUR"; }
            else if (upperName.includes("FİLE") || upperName.includes("FILE")) { bgColor = "#8e44ad"; shortName = "FİLE"; }

            return { color: bgColor, label: shortName };
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            lat1 = parseFloat(lat1); lon1 = parseFloat(lon1); lat2 = parseFloat(lat2); lon2 = parseFloat(lon2);
            if (isNaN(lat1) || isNaN(lon1) || isNaN(lat2) || isNaN(lon2)) return 99999;
            const R = 6371.0;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.asin(Math.sqrt(Math.min(1, Math.max(0, a))));
        }

        function setLocationAndSearch(lat, lon, zoomTo = false) {
            try {
                if (zoomTo) map.flyTo([lat, lon], window.innerWidth < 768 ? 13 : 14);

                if (currentRoute) map.removeLayer(currentRoute);

                if (!userMarker) {
                    userMarker = L.marker([lat, lon], { icon: redPin, draggable: true, zIndexOffset: 1000 }).addTo(map);
                    userMarker.on('dragend', function() {
                        let pos = userMarker.getLatLng();
                        updateNearestMarkets(pos.lat, pos.lng);
                    });
                } else {
                    userMarker.setLatLng([lat, lon]);
                }

                updateNearestMarkets(lat, lon);
            } catch(err) {
                console.error(err);
            }
        }

        function updateNearestMarkets(userLat, userLon) {
            let listDiv = document.getElementById('market-list');

            if (currentRoute) map.removeLayer(currentRoute);

            try {
                markersLayer.clearLayers();

                let results = [];
                for (let i = 0; i < allMarkets.length; i++) {
                    let m = allMarkets[i];
                    let dist = calculateDistance(userLat, userLon, m.lat, m.lon);
                    if (dist <= 15) { 
                        results.push({ ...m, distance: Math.round(dist * 100) / 100, originalIndex: i });
                    }
                }

                results.sort((a, b) => a.distance - b.distance);
                let nearest = results.slice(0, 15);

                if (nearest.length === 0) {
                    listDiv.innerHTML = `<p style="text-align:center;">Bu çevrede market bulunamadı.</p>`;
                    return;
                }

                let htmlContent = `<h3>En Yakın ${nearest.length} Market</h3>`;

                nearest.forEach((market, index) => {
                    let brand = getBrandInfo(market.name);

                    let dynamicIconHtml = `
                        <div class="market-badge" style="background-color: ${brand.color};">

                        </div>
                    `;

                    let customPin = L.divIcon({
                        className: 'custom-div-icon', 
                        html: dynamicIconHtml, 
                        iconSize: [0, 0] 
                    });

                    let marker = L.marker([market.lat, market.lon], { icon: customPin }).addTo(markersLayer);

                    let jsCall = `focusMarket('card-${market.id}', ${market.lat}, ${market.lon}, '${brand.color}', ${market.distance}, '${brand.label}')`;
                    marker.on('click', new Function(jsCall));

                    let gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${market.lat},${market.lon}`;

                    htmlContent += `
                        <div id="card-${market.id}" class="market-card" style="border-left-color: ${brand.color};">
                            <div onclick="${jsCall}" style="cursor: pointer;">
                                <span class="distance">${market.distance} km</span>
                                <b>${index + 1}. ${brand.label}</b>
                                <span class="market-fullname">${market.name}</span>
                            </div>
                            <a href="${gmapsUrl}" target="_blank" class="gmaps-btn" onclick="event.stopPropagation();">
                                🧭 Google Maps ile Yol Tarifi
                            </a>
                        </div>
                    `;
                });

                listDiv.innerHTML = htmlContent;

            } catch(err) {
                listDiv.innerHTML = `<p style="color:red;">Sistem Hatası:<br>${err.message}</p>`;
            }
        }

        function focusMarket(cardId, lat, lon, color, distance, name) {
            document.querySelectorAll('.market-card').forEach(c => c.classList.remove('active'));
            let activeCard = document.getElementById(cardId);
            if (activeCard) activeCard.classList.add('active');

            if (currentRoute) map.removeLayer(currentRoute);

            let userPos = userMarker.getLatLng();

            currentRoute = L.polyline([userPos, [lat, lon]], {
                color: color, weight: 4, dashArray: '8, 12', opacity: 0.9, lineCap: 'round'
            }).addTo(map);

            currentRoute.bindTooltip(`🚩 <span style="color:${color}">${name}</span><br>${distance} km`, {
                permanent: true, direction: 'center', className: 'route-tooltip'
            }).openTooltip();

            let paddingVal = window.innerWidth < 768 ? [40, 40] : [80, 80];

            map.flyToBounds(currentRoute.getBounds(), {
                padding: paddingVal, duration: 1.5, easeLinearity: 0.25
            });

            if (window.innerWidth < 768 && activeCard) {
                let sidebar = document.getElementById('sidebar');
                sidebar.scrollTo({ top: activeCard.offsetTop - 20, behavior: 'smooth' });
            }
        }

        function getLocationGPS() {
            let listDiv = document.getElementById('market-list');
            listDiv.innerHTML = `<p class="loading">🛰️ GPS bekleniyor...</p>`;
            if (!navigator.geolocation) {
                alert("Tarayıcı desteklemiyor."); return;
            }
            navigator.geolocation.getCurrentPosition(pos => {
                setLocationAndSearch(pos.coords.latitude, pos.coords.longitude, true);
            }, err => {
                alert("GPS izni verilmedi, haritaya tıklayın.");
                setLocationAndSearch(defaultLat, defaultLon, false);
            }, { enableHighAccuracy: true, timeout: 5000 });
        }

        window.onload = function() {
            map = L.map('map', { zoomControl: false }).setView([defaultLat, defaultLon], window.innerWidth < 768 ? 13 : 14);
            if (window.innerWidth > 768) {
                L.control.zoom({ position: 'bottomright' }).addTo(map);
            }

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19, attribution: 'Tiles &copy; Esri'
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);

            map.on('click', function(e) {
                setLocationAndSearch(e.latlng.lat, e.latlng.lng, false);
            });

            setLocationAndSearch(defaultLat, defaultLon, false);
        };
    </script>
</body>
</html>
